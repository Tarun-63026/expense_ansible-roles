   - name: disable node.js:18
     ansible.builtin.command: "dnf module disable nodejs -y"

   - name: enable node.js:20
     ansible.builtin.command: "dnf module enable nodejs:20 -y"

   - name: install nodejs and mysql
     ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
     loop:
       - nodejs
       - mysql

   - name: add the user
     ansible.builtin.user:
      name: expense

   - name: delete app directory
     ansible.builtin.file:
       path: /app
       state: absent
     ignore_errors: yes

   - name: create app directory
     ansible.builtin.file:
       path: /app
       state: directory

   - name: download and extract backend code
     ansible.builtin.unarchive:
       src: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
       dest: /app
       remote_src: yes

   - name: download the dependencies
     ansible.builtin.command: "npm install"
     args:
       chdir: /app

   - name: copy backend service
     ansible.builtin.template:
      src: backend.service.j2
      dest: /etc/systemd/system/backend.service

   - name: unmask backend service
     ansible.builtin.systemd_service:
      name: backend
      masked: no

   - name: Install Python MySQL dependencies
     ansible.builtin.pip:
      name:
        - PyMySQL     # to connect mysql db from ansible
        - cryptography # Required for password handling
      executable: pip3.9 # Set based on your target 'ansible --version'

   - name: check mysql password is setup or not
     community.mysql.mysql_info:
      login_user: root
      login_password: "{{ login_password }}"
      login_host: "{{ login_host }}"
      filter: version
     ignore_errors: yes
     register: mysql_connection_output

   - name: setup root password
     ansible.builtin.command: "mysql_secure_installation --set-root-pass {{ login_password }}"
     when: mysql_connection_output.failed is true
   
   - name: daemon reload backend
     ansible.builtin.systemd_service:
      daemon_reload: true
 
   - name: start and enable the backend service
     ansible.builtin.systemd_service:
      name: backend
      state: restarted
      enabled: yes


      