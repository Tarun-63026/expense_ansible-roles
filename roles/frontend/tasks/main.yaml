    - name: installing the nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: starting and enabling nginx
      ansible.builtin.service:
        name: nginx
        enabled: yes
        state: started

    - name: run app pre-requisities
      ansible.builtin.import_role:
       name: common
       tasks_from: app-pre-req
     
    - name: copy backend conf
      ansible.builtin.template:
        src: frontend.conf.j2
        dest: /etc/nginx/default.d/frontend.conf

    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted