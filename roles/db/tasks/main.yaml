- name: install mysql server
  ansible.builtin.dnf:
    name: mysql-server
    state: present

- name: enable and start the mysql sever
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: Install python dependencies
  ansible.builtin.pip:
    name:
      - PyMySQL  # Install the latest version
      - cryptography # required for password handling
    executable: pip3.9  # Adjusted to a standard pip3 executable name

- name: verify database
  community.mysql.mysql_info:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_host: "{{ login_host }}"
    filter: version
  ignore_errors: yes
  register: mysql_connection

- name: Check if mysql_root_password is defined
  ansible.builtin.debug:
    msg: "Root password variable is loaded successfully"
  when: mysql_root_password is defined