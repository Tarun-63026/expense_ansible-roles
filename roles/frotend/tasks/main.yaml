    - name: installing the nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: starting and enabling nginx
      ansible.builtin.service:
        name: nginx
        enabled: yes
        state: started

    - name: removing the default content in src
      ansible.builtin.file:
        path: /usr/share/nginx/html
        state: absent

    - name: creating new html directory
      ansible.builtin.file:
        path: /usr/share/nginx/html
        state: directory
  
    - name: downloading and extract the frontend content
      ansible.builtin.unarchive:
        src: https://expense-builds.s3.us-east-1.amazonaws.com/expense-frontend-v2.zip
        dest: /usr/share/nginx/html
        remote_src: yes
     
    - name: copy backend conf
      ansible.builtin.template:
        src: frontend.conf.j2
        dest: /etc/nginx/default.d/frontend.conf

    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted